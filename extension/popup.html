<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary: #1677ff; --primary-hover: #0f63dd; --primary-soft: #e8f1ff; --ink: #0d1728; --text: #1b2433;
    --muted: #64748b; --bg: #ffffff; --panel: #f5f8fc; --line: #e6ebf2; --err: #ef4444; --err-soft: #fdecec; --ok: #22c55e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --primary: #3b8bff; --primary-hover: #5c9eff; --primary-soft: #16294a; --ink: #eef3fa; --text: #dbe3ee;
      --muted: #93a1b5; --bg: #131f33; --panel: #0d1728; --line: #22314a; --err-soft: #3a1a1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  header { display: flex; align-items: center; gap: 7px; padding: 14px 14px 10px; font-weight: 700; font-size: 19px; color: var(--ink); letter-spacing: -.4px; }
  header .logo { width: 22px; height: 22px; }
  .iconbtn { margin-left: auto; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  .iconbtn:hover { background: var(--panel); color: var(--ink); }
  main { padding: 0 14px 14px; }
  [hidden] { display: none !important; }
  .banner { display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--err-soft); color: var(--err); margin-bottom: 12px; font-size: 12.5px; }
  .page { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--panel); margin-bottom: 12px; }
  .thumb { width: 64px; height: 44px; flex: none; border-radius: 8px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #14325f, #1677ff); }
  .page .t { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .page > div { min-width: 0; }
  .btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: 600 14px inherit; cursor: pointer; }
  .btn:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: none; color: var(--primary); border: 1px solid var(--line); font-size: 13px; padding: 9px; }
  .btn.ghost:hover { background: var(--primary-soft); }
  h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: none; }
  .opts { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .opt:last-child { border-bottom: 0; }
  .opt:hover { background: var(--panel); }
  .opt input { accent-color: var(--primary); margin: 0; }
  .opt .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .m { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .opt.bad { cursor: default; opacity: .6; }
  .opt .tag { color: var(--err); font-size: 11.5px; }
  .empty { text-align: center; padding: 18px 10px 14px; color: var(--muted); }
  .empty .ill { width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
  .empty b { display: block; color: var(--ink); margin-bottom: 3px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .check input { accent-color: var(--primary); margin: 0; }
  #msg { margin-top: 10px; font-size: 12.5px; min-height: 0; }
  #msg.err { color: var(--err); } #msg.ok { color: var(--ok); }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24"><path d="M13.5 2 4 13.5h6.5L9 22l11-12.5h-6.8z" fill="#1677ff"/></svg>velo.
  <button class="iconbtn" id="openApp" title="Open Velo"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></button>
</header>
<main>
  <div class="banner" id="access" hidden style="background:var(--hover,#eef4ff);color:inherit;flex-direction:column;align-items:stretch">
    <div><b>Let Velo see downloads and videos.</b> Firefox asks before an add-on can read pages; Velo needs this to catch downloads, find videos and keep you logged in to download sites.</div>
    <button class="btn primary" id="grant" style="margin-top:8px">Allow on all sites</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div id="body"></div>
  <div id="msg"></div>
  <label class="check"><input type="checkbox" id="detect"> Show “Link detected” when a page plays a video</label>
</main>
<script src="popup.js"></script>
</body>
</html>
