# Builds and publishes a Velo release when a version tag is pushed:
#
#   git tag v0.4.1 && git push origin v0.4.1
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (like 0.4.1); builds without publishing"
        required: true

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version
        id: v
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Velo $v"

      - name: Test
        run: go test ./...

      - name: Release notes
        run: node tools/release-notes.js ${{ steps.v.outputs.version }} > release-notes.md

      - name: Build
        run: ./tools/release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Checksums
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $files = "Velo-Setup-$v.exe", "Velo-Portable-$v.zip", "velo-extension-$v.zip", "velo-firefox-$v.zip"
          Push-Location dist
          $lines = foreach ($f in $files) { "{0} *{1}" -f (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower(), $f }
          Set-Content "SHA256SUMS-$v.txt" $lines
          Set-Content "Velo-Setup-$v.exe.sha256" $lines[0]
          Pop-Location
          Get-Content "dist/SHA256SUMS-$v.txt"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: velo-${{ steps.v.outputs.version }}
          path: |
            dist/*${{ steps.v.outputs.version }}*
            release-notes.md

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          gh release create "v$v" --title "Velo $v" --notes-file release-notes.md --verify-tag `
            "dist/Velo-Setup-$v.exe" "dist/Velo-Setup-$v.exe.sha256" "dist/Velo-Portable-$v.zip" `
            "dist/velo-extension-$v.zip" "dist/velo-firefox-$v.zip" "dist/SHA256SUMS-$v.txt"
          # Same files without the version, so the website can link to
          # releases/latest/download/Velo-Setup.exe.
          Copy-Item "dist/Velo-Setup-$v.exe" dist/Velo-Setup.exe
          Copy-Item "dist/Velo-Portable-$v.zip" dist/Velo-Portable.zip
          gh release upload "v$v" dist/Velo-Setup.exe dist/Velo-Portable.zip

      # Sends the new version to winget (microsoft/winget-pkgs) as a pull
      # request. Needs a WINGET_TOKEN secret: a classic GitHub token with the
      # public_repo scope. Skipped without it.
      - name: Update winget
        if: github.event_name == 'push' && env.WINGET_TOKEN != ''
        run: |
          $v = "${{ steps.v.outputs.version }}"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Adoxcol.Velo --version $v `
            --urls "https://github.com/Adoxcol/velo/releases/download/v$v/Velo-Setup-$v.exe" `
            --release-notes-url https://velo.adoxcol.com/changelog `
            --token $env:WINGET_TOKEN --submit
