<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<title>Velo Mini</title>
<style>
  :root { --primary: #1677ff; --ink: #0d1728; --muted: #64748b; --bg: #ffffff; --line: #e6ebf2; --hover: #f1f5f9; --ok: #22c55e; --warn: #f59e0b; }
  html[data-theme="dark"] { --primary: #3b8bff; --ink: #eef3fa; --muted: #93a1b5; --bg: #131f33; --line: #22314a; --hover: #1b2a42; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; border: 1px solid var(--line); border-radius: 8px; }
  .wrap { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 14px 12px 14px 14px; height: 100%; cursor: pointer; }
  .tile { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c, #94a3b8) 15%, transparent); color: var(--c, #94a3b8); }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tile svg.i { width: 26px; height: 26px; }
  .info { min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width .5s; }
  .done .bar i { background: var(--ok); }
  .acts { display: flex; gap: 2px; align-self: start; }
  button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
  button:hover { background: var(--hover); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .ask { position: fixed; inset: 0; background: var(--bg); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 14px; }
  .ask .q { font-weight: 600; }
  .ask .row { display: flex; gap: 6px; }
  .ask button { width: auto; height: 30px; padding: 0 12px; border: 1px solid var(--line); font: inherit; font-size: 12.5px; color: var(--ink); white-space: nowrap; }
  .ask button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .ask button.primary:hover { filter: brightness(1.08); }
  .ask button.link { border: 0; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<div class="wrap" id="wrap" title="Open Velo">
  <div class="tile" id="tile"></div>
  <div class="info"><div class="name" id="name">Starting…</div><div class="meta" id="meta"></div><div class="bar"><i id="bar" style="width:0"></i></div></div>
  <div class="acts"><button id="pp" title="Pause" aria-label="Pause"></button><button id="close" title="Hide Velo Mini" aria-label="Hide Velo Mini"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
</div>
<div class="ask" id="ask" hidden>
  <div class="q">Hide Velo Mini?</div>
  <div class="row">
    <button class="primary" id="hideNow" title="It comes back when you start another download">Until downloads finish</button>
    <button id="hideNever" title="Turn it back on in Settings or the tray menu">Don't show again</button>
    <button class="link" id="hideCancel">Cancel</button>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const ICON = {
  pause: '<path d="M9 5v14M15 5v14"/>',
  "Video": '<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/>',
  "Music": '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  "Images": '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 15-4.5-4.5L7 20"/>',
  "Documents": '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  "E-books": '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  "Compressed": '<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>',
  "Disk images": '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>',
  "Programs": '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7.5 13.5l2.5 2-2.5 2M12.5 17.5h4"/>',
  "Torrents": '<path d="M6 15 2 11l6.8-6.8a7.8 7.8 0 0 1 11 11L13 22l-4-4 6.4-6.4a2.1 2.1 0 0 0-3-3L6 15"/><path d="m5 8 4 4M12 15l4 4"/>',
  "Fonts": '<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
  "Other": '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
};
const TILE = {"Video":"#3b82f6","Music":"#a855f7","Images":"#14b8a6","Documents":"#f97316","E-books":"#ec4899","Compressed":"#d97706","Disk images":"#6366f1","Programs":"#64748b","Torrents":"#22c55e","Fonts":"#0ea5e9","Other":"#94a3b8"};
const svg = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
function size(n) { if (!(n > 0)) return "0 B"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i && n < 100 ? 1 : 0) + " " + u[i]; }
function eta(s) { s = Math.round(s); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map((v) => String(v).padStart(2, "0")).join(":"); }
let current = null;
async function refresh() {
  const st = await appStatus();
  const active = st.rows.filter((r) => r.status === "downloading");
  // Show the active download closest to finishing.
  const r = active.sort((a, b) => b.percent - a.percent)[0] || st.rows.filter((x) => x.status === "done").pop();
  if (!r) return;
  current = r;
  const cat = r.category || "Other";
  $("#tile").innerHTML = svg(ICON[cat] || ICON.Other);
  $("#tile").style.setProperty("--c", TILE[cat] || TILE.Other);
  $("#name").textContent = r.file || "Starting…";
  const pct = r.status === "done" ? 100 : r.percent;
  const parts = [r.total > 0 || r.kind ? pct.toFixed(0) + "%" : size(r.done)];
  if (r.status === "downloading") {
    parts.push(size(r.speed) + "/s");
    if (r.total > 0 && r.speed > 0) parts.push(eta((r.total - r.done) / r.speed) + " left");
  } else parts.push("Completed");
  if (active.length > 1) parts.push(`+${active.length - 1} more`);
  $("#meta").textContent = parts.join(" • ");
  $("#bar").style.width = pct + "%";
  document.body.classList.toggle("done", r.status === "done");
  $("#pp").innerHTML = svg(r.status === "downloading" ? ICON.pause : ICON.check);
  const title = r.status === "downloading" ? "Pause" : "Done";
  $("#pp").title = title;
  $("#pp").setAttribute("aria-label", title);
}
$("#pp").onclick = (e) => { e.stopPropagation(); if (current?.status === "downloading") pause(current.id).then(refresh); };
$("#close").onclick = (e) => { e.stopPropagation(); $("#ask").hidden = false; };
$("#hideNow").onclick = () => hideMini("now");
$("#hideNever").onclick = () => hideMini("never");
$("#hideCancel").onclick = () => { $("#ask").hidden = true; };
addEventListener("keydown", (e) => { if (e.key === "Escape") $("#ask").hidden = true; });

// Drag anywhere to move it (it has no title bar); a plain click opens Velo.
let down = null, dragged = false, moved = false;
$("#wrap").addEventListener("mousedown", (e) => { dragged = false; if (e.button === 0 && !e.target.closest("button")) down = [e.screenX, e.screenY]; });
addEventListener("mousemove", (e) => {
  if (!down || !(e.buttons & 1)) return (down = null);
  if (Math.hypot(e.screenX - down[0], e.screenY - down[1]) > 4) { down = null; dragged = moved = true; dragMini(); }
});
addEventListener("mouseup", () => { down = null; });
$("#wrap").onclick = () => { if (dragged) { dragged = false; return; } openMain(); };
getSettings().then((s) => {
  const dark = s.theme === "dark" || (s.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
});
refresh(); setInterval(() => { refresh(); if (moved) miniMoved(); }, 1000);
</script>
</body>
</html>
