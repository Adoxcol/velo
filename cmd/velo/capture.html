<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<title>Download file</title>
<style>
  :root { --primary: #1677ff; --primary-h: #0f6ae6; --ink: #0d1728; --muted: #64748b; --bg: #ffffff; --bg2: #f5f8fc; --line: #e3e9f2; --field: #ffffff; }
  html[data-theme="dark"] { --primary: #3b8bff; --primary-h: #5a9dff; --ink: #eef3fa; --muted: #93a1b5; --bg: #111b2e; --bg2: #0d1628; --line: #22314a; --field: #0d1628; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 13.5px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .top { display: flex; gap: 12px; align-items: center; padding: 12px 18px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  .tile { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; background: linear-gradient(135deg, #94a3b8, #64748b); }
  .tile svg { width: 20px; height: 20px; }
  .t-Video { background: linear-gradient(135deg, #3b82f6, #1d4ed8); } .t-Music { background: linear-gradient(135deg, #a855f7, #7c3aed); }
  .t-Images { background: linear-gradient(135deg, #14b8a6, #0d9488); } .t-Documents { background: linear-gradient(135deg, #fb923c, #ea580c); }
  .t-Compressed { background: linear-gradient(135deg, #facc15, #eab308); } .t-Programs { background: linear-gradient(135deg, #64748b, #475569); }
  .head { min-width: 0; flex: 1; }
  .name { width: 100%; font: 600 15px inherit; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 3px 6px; margin-left: -7px; user-select: text; }
  .name:hover { border-color: var(--line); }
  .name:focus { border-color: var(--primary); background: var(--field); outline: none; }
  .sub { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sub b { color: var(--ink); font-weight: 600; }
  .count { margin-left: auto; align-self: flex-start; color: var(--muted); font-size: 12px; white-space: nowrap; }

  .form { padding: 12px 18px 0; display: grid; grid-template-columns: 52px 1fr; gap: 8px 10px; align-items: center; }
  .form label { color: var(--muted); font-size: 12.5px; }
  .field { display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px; padding: 0 4px 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--field); }
  .field span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  .field svg { color: var(--muted); }
  .link { border: 0; background: none; color: var(--primary); font: 600 12.5px inherit; cursor: pointer; padding: 4px 8px; border-radius: 7px; }
  .link:hover { background: rgba(22, 119, 255, .1); }
  .url span { color: var(--muted); }

  .foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px 14px; }
  .foot .open { margin-right: auto; color: var(--muted); font-weight: 500; }
  .btn { height: 32px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 600 13.5px inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--bg2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-h); }
  .btn:disabled { opacity: .55; cursor: default; }
  .err { color: #dc2626; font-size: 12.5px; padding: 6px 18px 0; }
  .err:empty { display: none; }
</style>
</head>
<body>
  <div class="top">
    <div class="tile" id="tile"></div>
    <div class="head">
      <input class="name" id="name" spellcheck="false" title="File name (click to rename)">
      <div class="sub" id="sub"></div>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="form">
    <label>Link</label>
    <div class="field url" title=""><svg class="i" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span id="url"></span></div>
    <label>Save to</label>
    <div class="field"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="dir"></span><button class="link" id="change">Change…</button></div>
  </div>
  <div class="err" id="err"></div>
  <div class="foot">
    <button class="link open" id="open" title="Open the Velo window">Open Velo</button>
    <button class="btn" id="later" title="Add it to the queue, paused">Download later</button>
    <button class="btn primary" id="start"><svg class="i" viewBox="0 0 24 24" style="fill:#fff;stroke:none"><path d="M13.5 2 4 13.5h6.5L9 22l11-12.5h-6.8z"/></svg>Start download</button>
    <button class="btn" id="cancel">Cancel</button>
  </div>
<script>
const $ = (s) => document.getElementById(s);
const ICON = {
  Video: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>',
  Music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  Images: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  Documents: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
  Compressed: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 3v2M12 7v2M12 11v2"/><rect x="10.5" y="14" width="3" height="4" rx="1"/>',
  Programs: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14l2 2-2 2M13 18h3"/>',
  Other: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
};
const svg = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
function size(n) { if (!(n > 0)) return ""; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i && n < 100 ? 1 : 0) + " " + u[i]; }

let cur = null, customDir = "", busy = false, total = 0, done = 0;

async function showFolder() {
  const full = customDir || await folderFor($("name").value || "download");
  // Long paths are shortened in the middle so the end (the category folder) shows.
  $("dir").textContent = full.length > 64 ? full.slice(0, 3) + "…" + full.slice(-60) : full;
  $("dir").parentElement.title = full;
  $("dir").dataset.full = full;
}
async function showKind() {
  const cat = cur.kind ? "Video" : (await categoryOf($("name").value)) || "Other";
  $("tile").className = "tile t-" + cat;
  $("tile").innerHTML = svg(ICON[cat] || ICON.Other);
  const ext = ($("name").value.match(/\.([a-z0-9]{1,6})$/i) || [])[1];
  $("sub").innerHTML = [size(cur.size) && `<b>${size(cur.size)}</b>`, ext && ext.toUpperCase() + " file", cur.site && "from " + escapeHtml(cur.site)].filter(Boolean).map((x) => `<span>${x}</span>`).join("");
}
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Show the next waiting download, or close when there are none.
async function load() {
  cur = await nextPending();
  if (!cur) return closeDialog();
  done++;
  total = done - 1 + await pendingCount();
  $("count").textContent = total > 1 ? `${done} of ${total}` : "";
  $("name").value = cur.filename || cur.url.split(/[?#]/)[0].split("/").pop() || "download";
  $("url").textContent = cur.url;
  $("url").parentElement.title = cur.url;
  $("err").textContent = "";
  await Promise.all([showFolder(), showKind()]);
  $("start").focus();
}
// More downloads arrived while the dialog was open.
window.refreshPending = async () => { total = done - 1 + await pendingCount(); $("count").textContent = total > 1 ? `${done} of ${total}` : ""; };

async function finish(start) {
  if (busy || !cur) return;
  busy = true; $("start").disabled = $("later").disabled = true;
  try {
    await addDownload({ pendingId: cur.id, url: cur.url, filename: $("name").value.trim(), dir: customDir, segments: 0, start });
    await load();
  } catch (e) {
    $("err").textContent = String(e);
  } finally {
    busy = false; $("start").disabled = $("later").disabled = false;
  }
}
async function cancel() {
  if (!cur) return closeDialog();
  await dropPending(cur.id);
  load();
}

$("start").onclick = () => finish(true);
$("later").onclick = () => finish(false);
$("cancel").onclick = cancel;
$("open").onclick = () => openMain();
$("change").onclick = async () => {
  try { const p = await pickFolder(customDir || $("dir").dataset.full); if (p) { customDir = p; showFolder(); } } catch (e) { $("err").textContent = String(e); }
};
$("name").oninput = () => { showKind(); if (!customDir) showFolder(); };
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); cancel(); }
  if (e.key === "Enter") { e.preventDefault(); finish(true); }
});

getSettings().then((s) => {
  const dark = s.theme === "dark" || (s.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
});
load();
</script>
</body>
</html>
